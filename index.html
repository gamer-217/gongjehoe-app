<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>일하는 외국인 공제회 — Prototype v0.3</title>
<style>
:root{--paper:#F6F5F1;--ink:#20241F;--g:#0E5138;--g2:#E3EFE7;--red:#C2402A;--rule:#D9D6CC;--mut:#6b6f68}
*{box-sizing:border-box;margin:0}
body{background:var(--paper);color:var(--ink);font-family:'Pretendard','Malgun Gothic','Noto Sans KR','Noto Sans Devanagari',sans-serif}
header{background:var(--g);color:var(--paper);padding:13px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header h1{font-size:16px;font-weight:800;letter-spacing:.2px}
nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
nav select,nav button{border:1px solid #ffffff55;background:transparent;color:var(--paper);padding:6px 10px;border-radius:7px;cursor:pointer;font-size:13px}
nav select option{color:var(--ink)}
nav button.on{background:var(--paper);color:var(--g);font-weight:800}
main{max-width:760px;margin:0 auto;padding:18px 16px 60px}
.mobile{max-width:430px}
.sub{display:flex;gap:0;border:1px solid var(--rule);border-radius:9px;overflow:hidden;margin-bottom:16px;background:#fff}
.sub button{flex:1;border:0;border-right:1px solid var(--rule);background:#fff;color:var(--ink);padding:10px;cursor:pointer;font-weight:700;font-size:13px}
.sub button:last-child{border-right:0}
.sub button.on{background:var(--g);color:#fff}
.book{background:#fff;border:1px solid var(--rule);border-radius:4px;padding:2px 18px;margin-bottom:14px}
.row{display:flex;align-items:baseline;gap:8px;padding:11px 0;border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.row .nm{font-weight:700;font-size:13.5px}
.row .nt{color:var(--mut);font-size:11.5px;margin-top:2px}
.row .amt{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.leader{flex:1;border-bottom:1px dotted var(--rule);transform:translateY(-4px)}
.hero{padding:20px 2px 16px;text-align:left}
.hero .lbl{font-size:12px;color:var(--mut);letter-spacing:.3px}
.hero .big{font-size:40px;font-weight:800;color:var(--g);font-variant-numeric:tabular-nums;line-height:1.15}
.hero .big .won{font-size:20px;font-weight:600;margin-right:2px}
.profile{display:flex;align-items:center;gap:10px;padding:14px 2px;border-bottom:2px solid var(--ink)}
.profile h2{font-size:19px}
.tag{background:var(--g2);color:var(--g);border-radius:4px;padding:2px 8px;font-size:11.5px;font-weight:800}
.prog{margin-left:auto;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.stamp{width:62px;height:62px;border:2.5px solid var(--red);border-radius:50%;color:var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;transform:rotate(-8deg);font-size:11px;line-height:1.25;opacity:.92;flex:none;box-shadow:inset 0 0 0 1.5px #c2402a33}
.stamp b{font-size:14px}
.stamp.big{width:96px;height:96px;font-size:13px;margin:18px auto}
.stamp.big b{font-size:19px}
.btn{display:block;width:100%;background:var(--g);color:#fff;border:0;border-radius:9px;padding:14px;font-size:15.5px;font-weight:800;cursor:pointer;margin-top:10px}
.btn.ghost{background:#fff;color:var(--g);border:1.5px solid var(--g)}
.linkrow{display:flex;align-items:center;gap:8px;padding:12px 2px;border-bottom:1px solid var(--rule);cursor:pointer;font-size:13.5px;font-weight:700}
.linkrow .st2{margin-left:auto;font-size:11px;font-weight:800;border-radius:5px;padding:2px 8px}
.ok2{background:var(--g2);color:var(--g)} .warn2{background:#F7E8C8;color:#8a6100}
.gh{font-size:12.5px;font-weight:800;color:var(--g);margin:18px 2px 6px;letter-spacing:.3px}
.st{margin-left:auto;font-size:11px;font-weight:800;border-radius:5px;padding:2px 8px;white-space:nowrap}
.st.on{background:var(--g2);color:var(--g)}.st.opt{background:#F7E8C8;color:#8a6100}
.st.x{background:#ECEBE6;color:#888}.st.new{background:var(--g);color:#fff}
.note{font-size:11px;color:var(--mut);margin:8px 2px}
.jl{margin:26px 6px 6px}
input[type=range]{width:100%;-webkit-appearance:none;height:3px;background:linear-gradient(90deg,var(--g) 0 0) no-repeat,var(--rule);border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--g);cursor:pointer}
.jlbl{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:6px}
.bars{margin-top:14px}
.bar{height:26px;border-radius:3px;background:var(--g);margin:6px 0;display:flex;align-items:center;color:#fff;font-size:11.5px;font-weight:700;padding:0 8px;white-space:nowrap}
.bar.gray{background:#b9b7ae;color:#fff}
.steps{display:flex;gap:6px;margin:4px 0 18px}
.steps div{flex:1;text-align:center;font-size:12px;padding:8px 4px;border-bottom:3px solid var(--rule);color:var(--mut);font-weight:700}
.steps div.on{border-color:var(--g);color:var(--g)}
.field{margin:12px 0}
.field label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px}
.field input,.field select{width:100%;padding:11px;border:1px solid var(--rule);border-radius:8px;background:#fff;font-size:14px;color:var(--ink)}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--rule);border-radius:14px 14px 0 0;padding:22px;box-shadow:0 -8px 30px #0002;max-width:430px;margin:0 auto;text-align:center;z-index:9}
.fork{display:flex;gap:10px;margin:14px 0}
.fork>div{flex:1;border:1.5px solid var(--g);border-radius:8px;padding:14px 10px;text-align:center}
.fork .t{font-weight:800;font-size:13.5px;margin-bottom:6px;color:var(--g)}
.fork .d{font-size:11.5px;color:var(--mut);line-height:1.5}
.kpis{display:flex;border:1px solid var(--rule);border-radius:4px;background:#fff;margin-bottom:14px}
.kpis>div{flex:1;padding:14px;border-right:1px solid var(--rule)}
.kpis>div:last-child{border-right:0}
.kpis .l{font-size:11px;color:var(--mut)}
.kpis .v{font-size:21px;font-weight:800;color:var(--g);font-variant-numeric:tabular-nums;margin-top:3px}
table{width:100%;border-collapse:collapse;background:#fff;font-size:12.5px}
th,td{border-bottom:1px solid var(--rule);padding:9px 8px;text-align:left}
th{font-size:11.5px;color:var(--mut);font-weight:700;border-bottom:2px solid var(--ink)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
th.num{text-align:right}
.feed{background:#fff;border:1px solid var(--rule);border-radius:4px;padding:4px 14px;margin-top:14px}
.chk{color:var(--red);font-weight:800;margin-right:4px}
.wm{position:fixed;top:70px;right:14px;font-size:11px;color:#b9b7ae;border:1px solid #b9b7ae;padding:2px 8px;border-radius:4px;transform:rotate(3deg)}
.divline{border-top:1px dashed var(--g);margin:4px 0;padding-top:6px;font-size:11px;color:var(--g);font-weight:700}
.divyear{background:var(--g2);border-radius:3px;padding:7px 8px;font-size:12px;font-weight:700;color:var(--g);margin:4px 0}
svg.spark{display:block;margin:8px 0}
.back{background:none;border:0;color:var(--mut);font-size:13px;cursor:pointer;padding:4px 0;margin-bottom:8px}
.onb{display:flex;flex-direction:column;min-height:78vh;justify-content:center;padding:10px 4px}
.logo{width:88px;height:88px;border:3px solid var(--g);border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;position:relative;background:#fff}
.logo b{color:var(--g);font-size:30px;letter-spacing:-1px}
.logo::after{content:"";position:absolute;inset:5px;border:1px solid var(--g);border-radius:50%;opacity:.4}
.logo .mini{position:absolute;right:-9px;bottom:-6px;width:34px;height:34px;border:2px solid var(--red);border-radius:50%;color:var(--red);font-size:8.5px;font-weight:800;display:flex;align-items:center;justify-content:center;transform:rotate(-10deg);background:#fff}
.onb h1{text-align:center;font-size:21px;color:var(--ink)}
.onb .promise{text-align:center;color:var(--mut);font-size:13.5px;margin:8px 0 26px}
.langrow{display:flex;align-items:center;padding:13px 10px;border-bottom:1px solid var(--rule);cursor:pointer;font-size:14.5px;font-weight:600}
.langrow:last-child{border-bottom:0}
.langrow.sel{background:var(--g2);font-weight:800}
.langrow .ck{margin-left:auto;color:var(--g);font-weight:800;opacity:0}
.langrow.sel .ck{opacity:1}
.onb .demo{text-align:center;font-size:12px;color:var(--mut);margin-top:18px}
.onb .demo a{color:var(--g);font-weight:700;cursor:pointer;margin:0 6px;text-decoration:underline}
.cr.tap{cursor:pointer}
.cdetail{font-size:12.5px;color:var(--ink);background:var(--paper);border-left:3px solid var(--g);padding:10px 12px;margin:2px 0 10px;line-height:1.65;border-radius:0 6px 6px 0}
.tl{display:flex;align-items:flex-start;margin:18px 0 6px}
.tl>div{flex:1;text-align:center;position:relative;font-size:10.5px;color:var(--mut);line-height:1.45}
.tl>div::before{content:"";display:block;width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid var(--g);margin:0 auto 6px;position:relative;z-index:1}
.tl>div::after{content:"";position:absolute;top:5px;left:50%;width:100%;height:2px;background:var(--rule)}
.tl>div:last-child::after{display:none}
.tl b{display:block;color:var(--ink);font-size:11.5px}
.jump{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.jump button{border:1px solid var(--g);background:#fff;color:var(--g);border-radius:6px;padding:4px 12px;font-size:12px;font-weight:700;cursor:pointer}
@media(max-width:480px){.kpis{flex-direction:column}.kpis>div{border-right:0;border-bottom:1px solid var(--rule)}}
</style></head><body>
<header><h1>일하는 외국인 공제회 <span style="opacity:.6;font-weight:400;font-size:12px">prototype v0.3</span></h1>
<nav>
  <select id="who"></select>
  <select id="lang"><option value="ko" selected>한국어</option><option value="en">EN</option><option value="vi">VI</option><option value="ne">NE</option><option value="id">ID</option></select>
  <button data-r="worker" class="on">근로자</button><button data-r="employer">사업주</button><button data-r="admin">관리자</button>
</nav></header>
<main id="view"></main>

function account(w,months,p=PARAMS){
 const m0=months??w.months,r=p.fund_return/12;let bal=0,me=0,emp=0;
 for(let m=0;m<m0;m++){const er=p.employer_rate_steps[Math.min(Math.floor(m/24),2)];
  me+=w.wage*p.worker_rate;emp+=w.wage*er;bal=(bal+w.wage*(p.worker_rate+er))*(1+r);}
 return{me,emp,gain:bal-me-emp,total:bal};}

function refundNow(w,months){if(!w.nps)return 0;
 const pr=w.wage*.09*months;return pr*(1+.022*(months/24));}

const COV_ORDER=w=>({now:["sanjae","geonbo","goyong1","goyong2","sanghae"],
 leave:["gongje","chulguk","gwiguk"],
 gap:[w.nps?"nps_on":"nps_off","janggi"]});
// ───────── 유틸 ─────────
const $=s=>document.querySelector(s);
const fmt=n=>Math.round(n).toLocaleString("ko-KR");
const won=n=>`<span class="won">₩</span>${fmt(n)}`;
const BASE_Y=2026,BASE_M=9; // 최신 납입월(시연 기준)
function ymOf(w,k){const t=BASE_Y*12+(BASE_M-1)-(w.months-k);return[Math.floor(t/12),t%12+1];}
let state={role:"worker",workerId:"W001",lang:"ko",wtab:"acct",step:1,sec:false,nominee:null,simM:null,entered:false,covOpen:null};
const W=()=>WORKERS.find(x=>x.id===state.workerId);
const T=()=>STR[state.lang];
// ───────── 온보딩 (A1) ─────────
const LANGS=[["ko","한국어"],["en","English"],["vi","Tiếng Việt"],["ne","नेपाली"],["id","Bahasa Indonesia"]];
function vOnboard(t){
 return `<div class="onb">
  <div class="logo"><b>공</b><span class="mini">확인</span></div>
  <h1>일하는 외국인 공제회</h1>
  <div class="promise">${t.promise}</div>
  <div class="book" style="margin-bottom:18px">${LANGS.map(([c,n])=>
    `<div class="langrow ${state.lang===c?"sel":""}" data-lang="${c}">${n}<span class="ck">✓</span></div>`).join("")}</div>
  <div class="field"><label>${t.idlabel}</label><input value="900101-5•••••••" disabled></div>
  <button class="btn" data-go="enter">${t.start}</button>
  <div class="demo">데모: <a data-enter-role="employer">사업주 포털</a>·<a data-enter-role="admin">관리자</a></div>
 </div>`;}
// ───────── 근로자 화면 ─────────
function vAcct(w,t){const a=account(w);const[y,m]=ymOf(w,w.months);
 return `
 <div class="profile"><h2>${w.name}</h2><span class="tag">${w.visa} · ${w.cc}</span>
   <span class="prog">${w.months}/${PARAMS.maturity} ${t.months}</span></div>
 <div class="hero"><div class="lbl">${t.total}</div><div class="big">${won(a.total)}</div></div>
 <div class="book">
   <div class="row"><span class="nm">${t.mine} (4%)</span><span class="leader"></span><span class="amt">${fmt(a.me)}</span></div>
   <div class="row"><div><div class="nm">${t.boss} (2→4%)</div><div class="nt">${t.cur}: ${(PARAMS.employer_rate_steps[Math.min(Math.floor((w.months-1)/24),2)]*100).toFixed(0)}% · ${Math.min(Math.floor((w.months-1)/24),2)===2?"49":Math.floor((w.months-1)/24)*24+1+"~"+(Math.floor((w.months-1)/24)+1)*24}${Math.min(Math.floor((w.months-1)/24),2)===2?"개월차~":"개월차"}</div></div><span class="leader"></span><span class="amt">${fmt(a.emp)}</span></div>
   <div class="row"><span class="nm">${t.gain}</span><span class="leader"></span><span class="amt">${fmt(a.gain)}</span></div>
   <div class="row"><div><div class="nm">${y}.${String(m).padStart(2,"0")}</div><div class="nt">${fmt(w.wage*(.04+PARAMS.employer_rate_steps[Math.min(Math.floor((w.months-1)/24),2)]))}원</div></div>
     <div class="stamp" style="margin-left:auto"><span>공제회</span><b>${t.paid}</b><span>${m}月</span></div></div>
 </div>
 <button class="btn" data-go="sim">${t.simulate}</button>
 <div style="margin-top:16px">
   <div class="linkrow" data-go="bridge">🏠 한국에 계속 산다면 — E-7-4 전환 미리보기</div>
   <div class="linkrow" data-go="nominee">👪 수급권자(가족) 지정
     <span class="st2 ${state.nominee?"ok2":"warn2"}">${state.nominee?("지정 완료 — "+state.nominee):"미지정"}</span></div>
 </div>`;}
function vLedger(w,t){const rows=[];let bal=0;const r=PARAMS.fund_return/12;
 const pts=[];
 for(let k=1;k<=w.months;k++){const er=PARAMS.employer_rate_steps[Math.min(Math.floor((k-1)/24),2)];
  const me=w.wage*.04,emp=w.wage*er;bal=(bal+me+emp)*(1+r);
  const[y,m]=ymOf(w,k);pts.push(bal);
  rows.push({k,y,m,me,emp,bal,er});}
 const max=bal,n=rows.length;
 const poly=rows.map((p,i)=>`${(i/(n-1||1)*300).toFixed(1)},${(44-p.bal/max*40).toFixed(1)}`).join(" ");
 let out=`<div class="profile"><h2>${t.tabLedger}</h2><span class="tag">${w.visa}</span><span class="prog">${w.months} ${t.months}</span></div>
 <svg class="spark" width="100%" height="48" viewBox="0 0 300 48" preserveAspectRatio="none"><polyline points="${poly}" fill="none" stroke="#0E5138" stroke-width="1.6"/></svg>
 <div class="book">`;
 for(let i=rows.length-1;i>=0;i--){const p=rows[i];
  if(p.k===49)out+=`<div class="divline">↑ 사업주 기여율 3% → 4%</div>`;
  if(p.k===25)out+=`<div class="divline">↑ 사업주 기여율 2% → 3%</div>`;
  if(p.m===12)out+=`<div class="divyear">${p.y}년 ${t.gain} 확정 +3.0%</div>`;
  out+=`<div class="row"><div><div class="nm">${p.y}.${String(p.m).padStart(2,"0")}</div>
    <div class="nt">${t.mine} ${fmt(p.me)} · ${t.boss} ${fmt(p.emp)} (${(p.er*100).toFixed(0)}%)</div></div>
    <span class="amt">${fmt(p.bal)}</span>${p.k===1?'<div class="stamp" style="width:46px;height:46px;font-size:9px;margin-left:8px"><b style="font-size:10px">'+t.paid+'</b></div>':""}</div>`;}
 return out+"</div>";}
function vSim(w,t){const m=state.simM??w.months;const a=account(w,m);const ref=refundNow(w,m);
 const pct=((m-1)/(PARAMS.maturity-1)*100).toFixed(1);
 return `<button class="back" data-go="acct">${t.back}</button>
 <div class="profile"><h2>${t.simulate}</h2></div>
 <div class="hero"><div class="lbl">${m} ${t.months}</div><div class="big">${won(a.total)}</div></div>
 <div class="jl"><input type="range" id="simr" min="1" max="${PARAMS.maturity}" value="${m}" style="background:linear-gradient(90deg,var(--g) ${pct}%,var(--rule) ${pct}%)">
   <div class="jlbl"><span>입국</span><span>${t.today}(${w.months})</span><span>${t.mat} ${PARAMS.maturity}</span></div>
 <div class="jump"><button data-go="simToday">${t.today}</button><button data-go="simMat">${t.mat}</button></div></div>
 <div class="bars">
   <div class="gh">공제회 (사업주 기여 포함)</div>
   <div class="bar" style="width:100%">₩${fmt(a.total)}</div>
   <div class="gh">현행 제도라면</div>
   ${w.nps?`<div class="bar gray" style="width:${Math.max(ref/a.total*100,14).toFixed(1)}%">₩${fmt(ref)}</div><div class="note">국민연금 반환일시금 — 원금(노사 9%)+이자 2.2% 약식 예시 산정</div>`
         :`<div class="bar gray" style="width:14%">₩0</div><div class="note">${w.country} 국적: 국민연금 당연적용 제외(상호주의) — 노후 적립 없음</div>`}
 </div>
 <div class="note">운용수익은 연 3% 보수 가정의 예시입니다</div>
 <button class="btn" data-go="apply">${t.apply} →</button>`;}
function vApply(w,t){const s=state.step;
 const steps=`<div class="steps"><div class="${s>=1?"on":""}">1 신고</div><div class="${s>=2?"on":""}">2 계좌</div><div class="${s>=3?"on":""}">3 완료</div></div>`;
 if(s===1)return `<button class="back" data-go="sim">${t.back}</button><div class="profile"><h2>${t.apply}</h2></div>${steps}
  <div class="field"><label>출국 예정일 — 항공권 날짜만 있으면 됩니다. 서류는 필요 없습니다.</label><input type="date" value="2026-12-15"></div>
  <button class="btn" data-go="step2">다음 →</button>`;
 if(s===2)return `<button class="back" data-go="apply1">${t.back}</button><div class="profile"><h2>${t.apply}</h2></div>${steps}
  <div class="field"><label>본국 수령 계좌</label><select><option>${w.bank}</option><option>다른 은행…</option></select></div>
  <div class="field"><label>예상 수령액</label><input value="₩${fmt(account(w).total)}" disabled></div>
  <button class="btn" data-go="sec">다음 →</button>
  ${state.sec?`<div class="sheet"><div style="font-size:34px">👆</div><b>본인 확인</b><div class="note">고액 거래 보안 승인 — 지문을 대 주세요</div><button class="btn" data-go="step3">확인됨 → 접수</button></div>`:""}`;
 return `<div class="profile"><h2>${t.apply}</h2></div>${steps}
  <div class="stamp big"><span>공제회</span><b>접수 완료</b><span>${BASE_Y}.${BASE_M}</span></div>
  <p style="text-align:center;font-weight:700">출국 확인 후 3일 내 지급됩니다</p>
  <p class="note" style="text-align:center">말레이시아 EPF 출국 인출: 지점 방문·서류 다수 — 공제회: 앱 3단계·서류 0건</p>
  <button class="btn ghost" data-go="acct">${t.tabAcct}</button>`;}
function vBridge(w,t){const a=account(w);
 return `<button class="back" data-go="acct">${t.back}</button>
 <div class="profile"><h2>한국에 계속 살게 된다면</h2></div>
 <div class="hero"><div class="lbl">현재 적립</div><div class="big">${won(a.total)}</div></div>
 <div class="fork">
   <div><div style="font-size:26px">✈️</div><div class="t">귀국</div><div class="d">100% 환급<br>출국 확인 후 3일 내 지급</div></div>
   <div><div style="font-size:26px">🏠</div><div class="t">E-7-4 전환</div><div class="d">국민연금으로 이체<br>가입기간 ${w.months}개월 합산 인정</div></div>
 </div>
 <div class="note">어느 쪽을 선택해도 적립금은 사라지지 않습니다 — 전환 시 공제회 적립액과 가입기간이 국민연금에 승계됩니다(포터빌리티 브리지, 제안)</div>
 <div class="gh">전환하면 이렇게 흘러갑니다</div>
 <div class="tl">
   <div><b>E-7-4 전환</b>공제회 → 국민연금<br>이체·기간 합산</div>
   <div><b>계속 납부</b>내국인과 동일<br>규칙 적용</div>
   <div><b>10년 충족</b>연금 수급권 확보<br>(미만이면 반환일시금)</div>
   <div><b>65세~</b>연금 수령 —<br>귀국해도 본국 계좌로</div>
 </div>
 <div class="note">핵심은 나이가 아니라 가입기간: 10년을 채우면 어디에 살든 65세부터 평생 연금이 나옵니다.</div>`;}
function vNominee(w,t){
 return `<button class="back" data-go="acct">${t.back}</button>
 <div class="profile"><h2>수급권자 지정</h2>${state.nominee?'<span class="st2 ok2" style="margin-left:auto">지정 완료</span>':""}</div>
 <p class="note">만약을 위해, 이 돈을 받을 본국 가족을 정해 두세요.</p>
 <div class="field"><label>이름</label><input id="nmName" value="${state.nominee??""}" placeholder="예: Sita Gurung"></div>
 <div class="field"><label>관계</label><select id="nmRel"><option>배우자</option><option>부모</option><option>자녀</option></select></div>
 <div class="field"><label>연락처</label><input placeholder="+977 …"></div>
 <div class="field"><label>신분증 촬영 (e-KYC)</label><div style="border:1.5px dashed var(--rule);border-radius:8px;padding:26px;text-align:center;color:var(--mut)">📷 촬영하기</div></div>
 <button class="btn" data-go="saveNom">지정하기</button>`;}
function vCover(w,t){const o=COV_ORDER(w),L=state.lang;
 const row=k=>{const e=COV[k],[nm,line,det]=e.t[L]||e.t.ko;const open=state.covOpen===k;
  return `<div class="row tap" data-cov="${k}"><div><div class="nm">${nm}</div><div class="nt">${line}</div></div><span class="st ${e.st}">${t["st_"+e.st]}</span></div>`
   +(open?`<div class="cdetail">${det}</div>`:"");};
 const grp=(k,keys)=>`<div class="gh">${t[k]}</div><div class="book">`+keys.map(row).join("")+`</div>`;
 return `<div class="profile"><h2>${w.name}</h2><span class="tag">${w.visa} · ${w.cc}</span></div>`
  +grp("now",o.now)+grp("leave",o.leave)+grp("gap",o.gap);}
// ───────── 사업주 ─────────
function vEmployer(){
 const monthPay=w=>w.wage*(.04+PARAMS.employer_rate_steps[Math.min(Math.floor((w.months-1)/24),2)]);
 const empPay=w=>w.wage*PARAMS.employer_rate_steps[Math.min(Math.floor((w.months-1)/24),2)];
 const tot=WORKERS.reduce((s,w)=>s+empPay(w),0);
 const save=WORKERS.filter(w=>w.nps).reduce((s,w)=>s+w.wage*.0475-empPay(w),0)*12;
 const nps=[4.75,5,5.25,5.5,5.75,6,6.25,6.5],flat=[2,2,3,3,4,4,4,4];
 const pl=a=>a.map((v,i)=>`${i/(a.length-1)*300},${44-(v-1.5)/5.2*40}`).join(" ");
 return `<div class="profile"><h2>(주)대한금속</h2><span class="tag">E-9·H-2 ${WORKERS.length}명</span></div>
 <div class="kpis" style="margin-top:14px">
   <div><div class="l">이번 달 사업주 납부</div><div class="v">₩${fmt(tot)}</div></div>
   <div><div class="l">연간 절감(국민연금 대비·적용국 ${WORKERS.filter(w=>w.nps).length}명)</div><div class="v">₩${fmt(save)}</div></div>
   <div><div class="l">재직 근로자</div><div class="v">${WORKERS.length}명</div></div>
 </div>
 <div class="book"><div class="row"><div><div class="nm">절감 근거 (월 261만 원 기준)</div>
   <div class="nt">국민연금 1인당 연 1,487,700원(4.75%) → 공제회 1년차 626,400원(2%) = 연 861,300원 절감</div></div></div>
   <div style="padding:10px 0"><svg class="spark" width="100%" height="48" viewBox="0 0 300 48" preserveAspectRatio="none">
     <polyline points="${pl(nps)}" fill="none" stroke="#b9b7ae" stroke-width="1.6"/>
     <polyline points="${pl(flat)}" fill="none" stroke="#0E5138" stroke-width="2"/></svg>
   <div class="jlbl"><span>'26</span><span style="color:#8a8a84">회색: 국민연금 4.75→6.5% · 녹색: 공제회 2→4%</span><span>'33</span></div></div>
 </div>
 <table><tr><th>이름</th><th>비자</th><th class="num">재직</th><th class="num">당월 기여</th><th class="num">누적 기여</th><th class="num">요율</th></tr>
 ${WORKERS.map(w=>{const a=account(w);const er=PARAMS.employer_rate_steps[Math.min(Math.floor((w.months-1)/24),2)];
  return `<tr><td><b>${w.name}</b></td><td>${w.visa}</td><td class="num">${w.months}개월</td><td class="num">${fmt(empPay(w))}</td><td class="num">${fmt(a.emp)}</td><td class="num">${(er*100).toFixed(0)}%</td></tr>`;}).join("")}
 </table>
 <div class="feed">
   <div class="row"><span class="chk">✓</span><div><div class="nm">9월분 통합징수 납부 확인</div><div class="nt">4대보험 고지서에 공제회 1행 포함 — 추가 신고 없음</div></div></div>
   <div class="row"><span class="chk">✓</span><div><div class="nm">신규 고용 — 공제회 자동 가입 완료</div><div class="nt">Ramesh Gurung · 고용허가 연계 자동 등록</div></div></div>
 </div>`;}
// ───────── 관리자 ─────────
function vAdmin(){
 const tot=WORKERS.reduce((s,w)=>s+account(w).total,0);
 const by=WORKERS.map(w=>({c:w.country,v:account(w).total})).sort((a,b)=>b.v-a.v);
 const mx=by[0].v;
 return `<div class="wm">시연 데이터</div>
 <div class="profile"><h2>기금 현황</h2></div>
 <div class="kpis" style="margin-top:14px">
   <div><div class="l">가입자</div><div class="v">${WORKERS.length}명</div></div>
   <div><div class="l">적립 총액</div><div class="v">₩${fmt(tot)}</div></div>
   <div><div class="l">당월 환급</div><div class="v">0건</div></div>
   <div><div class="l">E-7-4 전환</div><div class="v">0건</div></div>
 </div>
 <div class="gh">국적별 적립 구성</div>
 <div class="book" style="padding:12px 18px">
 ${by.map(b=>`<div style="display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12px">
   <span style="width:76px">${b.c}</span>
   <div class="bar" style="flex:none;width:${(b.v/mx*62).toFixed(1)}%;height:18px;margin:0">​</div>
   <span style="font-variant-numeric:tabular-nums;color:var(--mut)">₩${fmt(b.v)}</span></div>`).join("")}
 </div>
 <div class="book" style="margin-top:14px"><div class="row"><div><div class="nm">재정 시뮬레이터 (몬테카를로)</div>
   <div class="nt">30년 기금 추이·고갈 확률 — docs/ref_fund-simulator.jsx 이식 예정 (D5)</div></div><span class="st x">예정</span></div></div>`;}
// ───────── 렌더 ─────────
function render(){
 const w=W(),t=T();
 document.querySelector("nav").style.display=state.entered?"flex":"none";
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.r===state.role));
 const v=$("#view");
 if(!state.entered){v.className="mobile";v.innerHTML=vOnboard(t);return;}
 if(state.role==="employer"){v.className="";v.innerHTML=vEmployer();return;}
 if(state.role==="admin"){v.className="";v.innerHTML=vAdmin();return;}
 v.className="mobile";
 const inTab=["acct","ledger","cover"].includes(state.wtab);
 const sub=`<div class="sub">
  <button data-w="acct" class="${state.wtab==="acct"?"on":""}">${t.tabAcct}</button>
  <button data-w="ledger" class="${state.wtab==="ledger"?"on":""}">${t.tabLedger}</button>
  <button data-w="cover" class="${state.wtab==="cover"?"on":""}">${t.tabCover}</button></div>`;
 const body={acct:vAcct,ledger:vLedger,cover:vCover,sim:vSim,apply:vApply,bridge:vBridge,nominee:vNominee}[state.wtab](w,t);
 v.innerHTML=(inTab?sub:"")+body;
 const r=$("#simr");
 if(r)r.addEventListener("input",e=>{state.simM=+e.target.value;render();});
}
document.addEventListener("click",e=>{
 const el=e.target.closest("[data-r],[data-w],[data-go],[data-lang],[data-enter-role],[data-cov]");if(!el)return;
 if(el.dataset.lang){state.lang=el.dataset.lang;$("#lang").value=state.lang;render();return;}
 if(el.dataset.cov){state.covOpen=state.covOpen===el.dataset.cov?null:el.dataset.cov;render();return;}
 if(el.dataset.enterRole){state.entered=true;state.role=el.dataset.enterRole;render();return;}
 if(el.dataset.r){state.role=el.dataset.r;state.wtab="acct";render();return;}
 if(el.dataset.w){state.wtab=el.dataset.w;state.simM=null;render();return;}
 const g=el.dataset.go;
 if(g==="enter"){state.entered=true;state.role="worker";state.wtab="acct";}
 else if(g==="sim"){state.wtab="sim";state.simM=W().months;}
 else if(g==="simToday"){state.simM=W().months;}
 else if(g==="simMat"){state.simM=PARAMS.maturity;}
 else if(g==="apply"){state.wtab="apply";state.step=1;state.sec=false;}
 else if(g==="apply1"){state.step=1;state.sec=false;}
 else if(g==="step2"){state.step=2;state.sec=false;}
 else if(g==="sec"){state.sec=true;}
 else if(g==="step3"){state.step=3;state.sec=false;}
 else if(g==="saveNom"){const n=$("#nmName").value.trim();if(n){state.nominee=n;state.wtab="acct";}}
 else{state.wtab=g;}
 render();
});
$("#lang").addEventListener("change",e=>{state.lang=e.target.value;render();});
$("#who").addEventListener("change",e=>{state.workerId=e.target.value;state.wtab="acct";state.simM=null;render();}); // 언어는 셀렉터로만 변경(기본 한국어)
$("#who").innerHTML=WORKERS.map(w=>`<option value="${w.id}">${w.name}</option>`).join("");
render();
</script></body></html>

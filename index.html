<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>일하는 외국인 공제회 — Prototype</title>
<style>
:root{--g:#0F5132;--g2:#DFF3E9;--ink:#1a1a1a;--mut:#667;--bg:#F6F8F7;font-family:'Malgun Gothic','Noto Sans KR',sans-serif}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--ink)}
header{background:var(--g);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header h1{font-size:17px}nav button,select{border:1px solid #fff5;background:transparent;color:#fff;padding:6px 10px;border-radius:8px;cursor:pointer;margin-left:6px}
nav select option{color:#1a1a1a}
nav button.on{background:#fff;color:var(--g);font-weight:700}
main{max-width:760px;margin:24px auto;padding:0 16px}
.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:14px;box-shadow:0 1px 4px #0001}
.big{font-size:32px;font-weight:800;color:var(--g)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row .card{flex:1;min-width:150px}
.mut{color:var(--mut);font-size:13px}.tag{background:var(--g2);color:var(--g);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
.btn{display:block;width:100%;background:var(--g);color:#fff;border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px}
.todo{opacity:.55;border:1px dashed #9ab}
</style></head><body>
<header><h1>일하는 외국인 공제회 <span class="mut" style="color:#cfe">v0.1</span></h1>
<nav>
  <select id="who"></select>
  <select id="lang"><option value="ko">한국어</option><option value="en">EN</option><option value="vi">VI</option><option value="ne" selected>NE</option><option value="id">ID</option></select>
  <button data-r="worker" class="on">근로자</button><button data-r="employer">사업주</button><button data-r="admin">관리자</button>
</nav></header>
<main id="view"></main>
<script>
// ── 제도 파라미터 — 전부 검증된 수치만 (출처: 정책제안서 2026.10 / 팩트체크원장)
const PARAMS = {
  worker_rate: 0.04,
  employer_rate_steps: [0.02, 0.03, 0.04],   // 시행 1년차→3년차→5년차
  gov_match: 0.10,                            // 별도 국고 (검토)
  fund_return: 0.03,                          // 보수 가정
  nps_employer_2026: 0.0475, nps_employer_2033: 0.065,
  refund_interest_2026: 0.022,                // 반환일시금 3년 정기예금이자율
  departure_insurance: 0.083,                 // 출국만기보험(존치, 별도)
  avg_wage: 2610000,                          // 월 평균임금 (경기남부 '24 조사)
};
const WORKERS = [
  { id:"W001", name:"Ramesh", country:"NP", lang:"ne", visa:"E-9", wage:2400000, months:36 },
  { id:"W002", name:"Nguyen Van An", country:"VN", lang:"vi", visa:"E-9", wage:2610000, months:18 },
  { id:"W003", name:"Siti Rahma", country:"ID", lang:"id", visa:"E-9", wage:2500000, months:52 },
  { id:"W004", name:"김해란", country:"CN", lang:"ko", visa:"H-2", wage:2800000, months:70 },
];
function account(w, p = PARAMS) {
  // 월복리 운용 가정의 단순 모형 (프로토 시연용)
  const r = p.fund_return / 12;
  let bal = 0, worker = 0, employer = 0;
  for (let m = 0; m < w.months; m++) {
    const er = p.employer_rate_steps[Math.min(Math.floor(m / 24), 2)];
    const c = w.wage * (p.worker_rate + er);
    worker += w.wage * p.worker_rate; employer += w.wage * er;
    bal = (bal + c) * (1 + r);
  }
  return { worker, employer, gain: bal - worker - employer, total: bal };
}
// ── i18n
const STR = {
  ko: { title:"일하는 외국인 공제회", myAccount:"내 계좌", total:"총 적립액", mine:"내 납부", boss:"사업주 기여", gain:"운용수익", simulate:"오늘 귀국하면", apply:"환급 신청", months:"개월 적립" },
  en: { title:"Working Foreigner Mutual Fund", myAccount:"My Account", total:"Total Balance", mine:"My Contribution", boss:"Employer Contribution", gain:"Investment Return", simulate:"If I return home today", apply:"Claim Refund", months:"months saved" },
  vi: { title:"Quỹ tương trợ lao động nước ngoài", myAccount:"Tài khoản của tôi", total:"Tổng số dư", mine:"Tôi đóng", boss:"Chủ sử dụng đóng", gain:"Lợi nhuận đầu tư", simulate:"Nếu về nước hôm nay", apply:"Yêu cầu hoàn trả", months:"tháng tích lũy" },
  ne: { title:"विदेशी श्रमिक पारस्परिक कोष", myAccount:"मेरो खाता", total:"कुल रकम", mine:"मेरो योगदान", boss:"रोजगारदाताको योगदान", gain:"लगानी प्रतिफल", simulate:"आज घर फर्किए भने", apply:"फिर्ता दाबी", months:"महिना बचत" },
  id: { title:"Dana Bersama Pekerja Asing", myAccount:"Akun Saya", total:"Total Saldo", mine:"Kontribusi Saya", boss:"Kontribusi Pemberi Kerja", gain:"Hasil Investasi", simulate:"Jika pulang hari ini", apply:"Klaim Pengembalian", months:"bulan menabung" },
};
// ── app
const won = n => "₩" + Math.round(n).toLocaleString("ko-KR");
const $ = s => document.querySelector(s);
let state = { role: "worker", workerId: "W001", lang: "ne" };

function workerView() {
  const w = WORKERS.find(x => x.id === state.workerId), t = STR[state.lang], a = account(w);
  return `
  <div class="card"><span class="tag">${w.visa} · ${w.country}</span>
    <h2 style="margin:8px 0 2px">${w.name}</h2>
    <div class="mut">${w.months} ${t.months}</div></div>
  <div class="card"><div class="mut">${t.total}</div><div class="big">${won(a.total)}</div></div>
  <div class="row">
    <div class="card"><div class="mut">${t.mine} (4%)</div><b>${won(a.worker)}</b></div>
    <div class="card"><div class="mut">${t.boss}</div><b>${won(a.employer)}</b></div>
    <div class="card"><div class="mut">${t.gain}</div><b>${won(a.gain)}</b></div>
  </div>
  <div class="card"><div class="mut">${t.simulate}</div><div class="big">${won(a.total)}</div>
    <button class="btn">${t.apply} →</button>
    <div class="mut" style="margin-top:8px">100% refund · 3 days after departure report</div></div>`;
}
const stub = n => `<div class="card todo"><b>${n}</b><div class="mut">D${n.includes("사업주")?4:5} 구현 예정</div></div>`;
function render() {
  $("#view").innerHTML = state.role === "worker" ? workerView()
    : state.role === "employer" ? stub("사업주 포털 — 기여 현황·절감 계산") : stub("관리자 대시보드 — 기금·몬테카를로");
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.r === state.role));
}
document.addEventListener("click", e => { if (e.target.dataset.r) { state.role = e.target.dataset.r; render(); } });
$("#lang").addEventListener("change", e => { state.lang = e.target.value; render(); });
$("#who").addEventListener("change", e => { state.workerId = e.target.value; state.lang = WORKERS.find(w=>w.id===e.target.value).lang; $("#lang").value = state.lang; render(); });
$("#who").innerHTML = WORKERS.map(w => `<option value="${w.id}">${w.name}</option>`).join("");
render();
</script></body></html>
